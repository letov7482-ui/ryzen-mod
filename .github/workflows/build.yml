name: Build PUBG Mod 4.5 (Paks)
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python3
        run: |
          sudo apt-get update
          sudo apt-get install -y python3
      - name: Download u4pak.py
        run: |
          wget https://raw.githubusercontent.com/panzi/u4pak/master/u4pak.py
          chmod +x u4pak.py
      - name: Prepare directories
        run: |
          mkdir -p PatchContent/ShadowTrackerExtra/Content/Script
          cp init.lua PatchContent/ShadowTrackerExtra/Content/Script/
      - name: Pack .pak with u4pak.py
        run: |
          cd PatchContent
          python3 ../u4pak.py pack ../pakchunkEN_9999.pak .
      - uses: actions/upload-artifact@v4
        with:
          name: ryzen-mod
          path: pakchunkEN_9999.pak
