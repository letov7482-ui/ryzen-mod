name: Build PUBG Mod 4.5
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python and u4pak
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          pip3 install u4pak
      - name: Prepare directories
        run: |
          mkdir -p PatchContent/ShadowTrackerExtra/Content/Script/UI
          cp UI_Ingame.lua PatchContent/ShadowTrackerExtra/Content/Script/UI/
      - name: Pack .pak with u4pak
        run: |
          cd PatchContent
          u4pak pack ../game_patch_4.5.0.21392.pak .
      - uses: actions/upload-artifact@v4
        with:
          name: ryzen-mod
          path: game_patch_4.5.0.21392.pak
